# Wolf data job: free market data for the Wolf's Morning Brief.
# This file belongs in your repo at:  .github/workflows/wolf-data.yml
name: Wolf Data

on:
  schedule:
    # Weekdays at 10:17 UTC = 5:17 AM New York time in winter, 6:17 AM in summer,
    # well before the Wolf's 7:12 AM brief. GitHub can start a few minutes late.
    - cron: "17 10 * * 1-5"
  workflow_dispatch: {}   # adds a "Run workflow" button

permissions:
  contents: write   # lets the job save the data files to this repo

concurrency:
  group: wolf-data
  cancel-in-progress: false

jobs:
  data:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install
        run: pip install "yfinance>=1.7"

      - name: Pull market data
        run: python wolf_data.py

      - name: Publish the data
        run: |
          git config user.name "wolf-data"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if ! git diff --cached --quiet; then
            git commit -m "Market data $(date -u +%F)"
            git pull --rebase --quiet
            git push
          fi
